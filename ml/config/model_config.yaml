# Model Configuration

# Label definitions (BIO tagging)

labels:
  - "O"           # Outside
  - "B-PERSON"    # Beginning of person name
  - "I-PERSON"    # Inside person name
  - "B-ADDRESS"   # Beginning of address
  - "I-ADDRESS"   # Inside address
  - "B-EMAIL"     # Email
  - "I-EMAIL"     # Inside email
  - "B-PHONE"     # Phone number
  - "I-PHONE"     # Inside phone
  - "B-PESEL"     # PESEL number
  - "I-PESEL"     # Inside PESEL
  - "B-NIP"       # NIP number
  - "I-NIP"       # Inside NIP
  - "B-REGON"     # REGON number
  - "I-REGON"     # Inside REGON

label2id:
  "O": 0
  "B-PERSON": 1
  "I-PERSON": 2
  "B-ADDRESS": 3
  "I-ADDRESS": 4
  "B-EMAIL": 5
  "I-EMAIL": 6
  "B-PHONE": 7
  "I-PHONE": 8
  "B-PESEL": 9
  "I-PESEL": 10
  "B-NIP": 11
  "I-NIP": 12
  "B-REGON": 13
  "I-REGON": 14

id2label:
    0: "O"
    1: "B-PERSON"
    2: "I-PERSON"
    3: "B-ADDRESS"
    4: "I-ADDRESS"
    5: "B-EMAIL"
    6: "I-EMAIL"
    7: "B-PHONE"
    8: "I-PHONE"
    9: "B-PESEL"
    10: "I-PESEL"
    11: "B-NIP"
    12: "I-NIP"
    13: "B-REGON"
    14: "I-REGON"

entity_types:
  - PERSON
  - ADDRESS
  - EMAIL
  - PHONE
  - PESEL
  - NIP
  - REGON